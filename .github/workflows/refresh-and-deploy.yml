name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    # Bonus/consistency passes: FOTN/PERF bonuses land on Wikipedia within
    # hours of an event, so Sunday evening usually merges them same-weekend
    # and Monday morning is the backstop. Fresh results themselves arrive
    # faster via watch-events.yml, which dispatches this workflow on demand.
    # Sunday midday is a stats/bonus catch-up a few hours after US cards
    # end — upgrades any 'basic'-quality event whose ESPN stats lagged the
    # first fast-path pass, and picks up early Wikipedia bonus edits.
    - cron: '0 12 * * 0' # Sunday 12:00 UTC
    - cron: '0 18 * * 0' # Sunday 18:00 UTC
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:

# Least privilege: every job declares exactly the permissions it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    # Data refresh only on schedule/manual runs; plain pushes just deploy.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the "data: refresh" commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh data (CSV + recent Wikipedia events)
        run: npm run data:refresh
      - name: Spoiler audit
        run: npm run audit
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi

  # GitHub Pages — the old address (deadalus5.github.io/knockout-or-not/).
  # Stage C of Domain_Migration.md turns this into a redirect stub once
  # knockoutornot.com is verified.
  deploy:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the data commit from the refresh job
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          KO_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Workers static assets — the new home (Domain_Migration.md).
  # Builds at base '/', smoke-tests that build (ci.yml does not run on cron),
  # then uploads with wrangler using web/wrangler.jsonc. The upload is
  # all-or-nothing: a failure here leaves the previous version serving.
  deploy-workers:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: https://knockoutornot.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the data commit from the refresh job
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (base '/')
        run: npm run build
      - name: Smoke test the build
        run: npm run smoke
      - name: Upload to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.128.0'
          workingDirectory: web
          command: deploy
