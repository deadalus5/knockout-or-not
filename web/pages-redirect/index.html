<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e12" />
    <title>KnockoutOrNot has moved</title>
    <!-- Served by GitHub Pages at the OLD address (deadalus5.github.io/knockout-or-not/),
         as both index.html and 404.html. It forwards every visitor to the same page on
         knockoutornot.com, keeping the path, query and #fragment. -->
    <link id="canonical" rel="canonical" href="https://knockoutornot.com/" />
    <script>
      (function () {
        var path = location.pathname.replace(/^\/knockout-or-not(?=\/|$)/, '') || '/';
        var target = 'https://knockoutornot.com' + path + location.search + location.hash;
        var canonical = document.getElementById('canonical');
        if (canonical) canonical.href = target.split('#')[0];
        location.replace(target);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://knockoutornot.com/" /></noscript>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0c0e12; color: #e8e8ed; }
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      .wordmark { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; margin: 0 0 1.5rem; }
      .or { color: #ff9f0a; } .not { color: #ff453a; }
      h1 { font-size: 1.6rem; margin: 0 0 0.75rem; }
      p { line-height: 1.5; margin: 0 0 0.75rem; color: #b5b5bd; }
      a { color: #ff9f0a; }
      .small { font-size: 0.9rem; color: #8a8a93; }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">Knockout<span class="or">Or</span><span class="not">Not</span></p>
      <h1>We have moved to knockoutornot.com</h1>
      <p>Taking you there now. If nothing happens in a moment, <a href="https://knockoutornot.com/">open knockoutornot.com</a>.</p>
      <p class="small">Please update any bookmark or home-screen shortcut to the new address. The spoiler-free fight guide itself is unchanged.</p>
    </main>
  </body>
</html>
